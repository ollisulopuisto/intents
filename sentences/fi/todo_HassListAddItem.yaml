language: "fi"
intents:
  HassListAddItem:
    data:
      - sentences:
          - "(lisää|laita|pane) <item> <my_list>"
          - "(lisää|laita|pane) <my_list> <item>"
        response: item_added
        requires_context:
          domain: todo
        expansion_rules:
          my_list: "[minun|mun|miun|meidän] lista[lle|lleni|llemme] {name}"
          item: "{todo_list_item:item}"
